<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>TWCX Alliance — Operations Portal</title>
    <meta name="description" content="Roster, storm signups, calendar, VS duel and community board for the TWCX alliance. All clocks in server time." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f12" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/styles.css?v=4" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0f12'/%3E%3Cpath d='M6 6h6v2H8v4H6zM26 6h-6v2h4v4h2zM6 26h6v-2H8v-4H6zM26 26h-6v-2h4v-4h2z' fill='%23e8a33d'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%235fa8a0' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <span class="atmosphere__grid"></span>
      <span class="atmosphere__glow atmosphere__glow--one"></span>
      <span class="atmosphere__glow atmosphere__glow--two"></span>
      <span class="atmosphere__grain"></span>
    </div>

    <div id="app" class="app">
      <div class="boot" role="status">
        <div class="boot__reticle">
          <span></span><span></span><span></span><span></span>
        </div>
        <p class="boot__label">TWCX ALLIANCE</p>
        <p class="boot__status">Establishing link to command…</p>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
    <div id="overlay" class="overlay" hidden></div>

    <script type="module" src="/app.js?v=4"></script>
  </body>
</html>
