name: Discord reminders

on:
  schedule:
    # Once an hour, every day. The script exits immediately unless a storm or
    # calendar event is within ~70 minutes, then it sleeps until T-5 and DMs.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Send due Discord DMs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/run-reminders.mjs
